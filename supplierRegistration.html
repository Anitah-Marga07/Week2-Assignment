<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: rgba(157, 156, 156, 0.514);
      }
      h1 {
        text-align: center;
      }
      /* input, select {
        background-color: rgba(157, 156, 156, 0.514);
      } */
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="navbar bg-dark navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Nyondo_Stock</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html">Sales Management</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="supplierRegistration.html">Supplier Management</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="stockMgt.html">Stock Management</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="transport.html">Transport Management</a>
              </li>
              
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-secondary" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>
      <div class="content">
        <form class="row g-3">
          <!--Section 1-->
          <h1>Supplier Registration</h1>
          <h3>Company Details</h3>
          <div class="col-md-6">
            <label for="fullname" class="form-label">Full Company Name</label>
            <input type="text" class="form-control" id="fullname" />
          </div>
          <div class="col-md-6">
            <label for="othername" class="form-label"
              >Other Company Name used</label
            >
            <input type="text" class="form-control" id="othername" />
          </div>
          <div class="col-md-6">
            <label for="inputEmail4" class="form-label"
              >Company Email Address</label
            >
            <input type="email" class="form-control" id="inputEmail4" />
          </div>
          <div class="col-md-6">
            <label for="inputPhonenumber" class="form-label" 
              >Company Phone Number</label
            >
            <input type="tel" class="form-control" id="inputPhonenumber" />
          </div>
          <div class="col-12">
            <label for="inputWebsite" class="form-label">Company Website</label>
            <input type="text" class="form-control" id="inputWebsite" placeholder="Enter company website name/address" />
          </div>
          <div class="col-12">
            <label for="inputAddress" class="form-label">Main Address</label>
            <input
              type="text"
              class="form-control"
              id="inputAddress"
              placeholder="Enter full address"
            />
          </div>
          <div class="col-12">
            <label for="inputAddress2" class="form-label"
              >Alternative Address</label
            >
            <input
              type="text"
              class="form-control"
              id="inputAddress2"
              placeholder="Enter Address"
            />
          </div>
          <div class="col-md-6">
            <label for="inputCity" class="form-label">City</label>
            <input type="text" class="form-control" id="inputCity" placeholder="Enter City"/>
          </div>
          <div class="col-md-4">
            <label for="inputState" class="form-label">Country</label>
            <select id="inputState" class="form-select">
              <option disabled selected>Select Country</option>
              <option value="1">Uganda</option>
              <option value="2">China</option>
              <option value="3">USA</option>
              <option value="4">UAE</option>
              <option value="5">Singapore</option>
              <option value="6">Phillipines</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="inputZip" class="form-label">Postal Code</label>
            <input type="text" class="form-control" id="inputZip" placeholder="Enter Postal Address" />
          </div>
          <div class="col-md-6">
            <label for="inputtype" class="form-label">Business Type</label>
            <select id="inputtype" class="form-select">
              <option disabled selected>Select</option>
              <option value="1">Coporate/Limited</option>
              <option value="2">Partnership</option>
              <option value="3">Other</option>
            </select>
          </div>
          <div class="col-12">
            <label for="inputpdttype" class="form-label">Product Supplied</label>
            <textarea class="form-control" rows="3" placeholder="List products/ services supplied"></textarea>
          </div>

          <!--Section 2-->
          <h3>Contact Person Details</h3>
          <div class="col-md-6">
            <label for="fname" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="fname"
              placeholder="e.g Mary Jane"
            />
          </div>
          <div class="col-md-6">
            <label for="title" class="form-label">Title/ Position</label>
            <input type="text" class="form-control" id="title" />
          </div>
          <div class="col-md-6">
            <label for="input-phonenumber" class="form-label"
              >Phone Number</label
            >
            <input type="tel" class="form-control" id="input-phonenumber" />
          </div>
          <div class="col-md-6">
            <label for="inputEmail2" class="form-label">Email Address</label>
            <input
              type="email"
              class="form-control"
              id="inputEmail2"
              placeholder="myname@example.com"
            />
          </div>

          <!--Section 3-->
          <h3>Bank Details</h3>
          <div class="col-md-6">
            <label for="acctname" class="form-label">Account Name</label>
            <input type="text" class="form-control" id="acctname" />
          </div>
          <div class="col-md-6">
            <label for="banknumber" class="form-label">Account Number</label>
            <input type="text" class="form-control" id="banknumber" />
          </div>
          <div class="col-md-6">
            <label for="bankname" class="form-label">Bank Name</label>
            <input type="text" class="form-control" id="bankname" />
          </div>
          <div class="col-md-6">
            <label for="currency" class="form-label">Currency</label>
            <select id="currency" class="form-select">
              <option disabled selected>Select Account Currency</option>
              <option value="1">UGX</option>
              <option value="2">KSh</option>
              <option value="3">Pounds</option>
              <option value="4">Euros</option>
              <option value="5">Rands</option>
              <option value="6">Dollars</option>
            </select>
          </div>
          <div class="col-12">
            <label for="inputfile" class="form-label"
              >Upload Proof of Bank Account Details
            </label>
            <input type="file" class="form-control" id="inputfile" />
          </div>

          <!--Submit section-->
          <div class="col-12">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="invalidCheck"
                required
              />
              <label class="form-check-label" for="invalidCheck">
                Agree to Payment terms and conditions
              </label>
              <div class="invalid-feedback">
                You must agree to terms and conditions before submitting.
              </div>
            </div>
          </div>
          <div class="col-12">
            <button class="btn btn-outline-secondary" type="submit">
              Submit form
            </button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
