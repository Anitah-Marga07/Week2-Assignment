<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      span {
        color: red;
      }
      .ann {
        border: 2px solid black;
        border-radius: 8px;
      }
      .sidebar {
        border-right: 1px solid black;
      }
      .pic {
        width: 100px;
        height: 100px;
        border: 1px solid grey;
        border-radius: 50%;
        background-color: rgba(128, 128, 128, 0.495);
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-tertiary">
    <div class="container-fluid">
      <nav class="navbar navbar-expand-lg bg-body-tertiary nav-underline nav-tabs">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Nyondo_Stock</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="index.html"
                  >Sales Management</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="supplierRegistration.html"
                  >Supplier Management</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="stockMgt.html">Stock Management</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="transport.html"
                  >Transport Management</a
                >
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-secondary" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>

      <div class="row">
        <div class="col-2 py-2 bg-secondary-subtle sidebar">
          <!-- Sidebar -->
          <div class="profile">
            <div class="pic"></div>
            <div class="name">
              <p>Name: Anitah Margaret</p>
              <p>Role: Admin</p>
            </div>
          </div>
        </div>
        <div class="col-10 py-2 bg-secondary-subtle">
          <div class="container">
            <div class="row">
              <h1 class="text-center">Stock Registration</h1>
              <div class="col my-3 ann">
                <form class="row g-3 my-3">
                  <!-- Section 1 -->
                  <div class="row my-3">
                    <h3>Basic Details</h3>
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Product Name<span>*</span>
                      </label>
                      <input
                        type="text"
                        class="form-control"
                        placeholder="Enter pdt name"
                        aria-label="First name"
                        required
                      />
                    </div>
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Category<span>*</span></label
                      >
                      <select
                        name="products"
                        id=""
                        class="form-control"
                        required
                      >
                        <option value="" selected disabled>
                          Select Category
                        </option>
                        <option value="B&C">
                          Building & Construction Materials
                        </option>
                        <option value="T&E">Tools & Eqipment</option>
                        <option value="Elec">Electrical Supplies</option>
                        <option value="P&S">Plumbing & Sanitary</option>
                        <option value="C&W">Carpentry & Woodwork</option>
                        <option value="P&F">Paints & Finishes</option>
                        <option value="S&P">Safety & Protective gear</option>
                        <option value="T&M">Transport & Miscellaneous</option>
                      </select>
                    </div>
                    <div class="row my-3">
                      <div class="col">
                        <label for="inputEmail4" class="form-label"
                          >Supplier / Vendor<span>*</span>
                        </label>
                        <input
                          type="text"
                          class="form-control"
                          placeholder="Enter Supplier name"
                          aria-label="First name"
                          required
                        />
                      </div>
                      <div class="col">
                        <label for="inputEmail4" class="form-label"
                          >Date of Purchase<span>*</span>
                        </label>
                        <input
                          type="date"
                          class="form-control"
                          aria-label="First name"
                          required
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Section 2 -->
                  <div class="row my-3">
                    <h3>Identification & Tracking</h3>
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >SKU<span>*</span>
                      </label>
                      <input
                        type="text"
                        class="form-control"
                        placeholder="Enter stock keeping unit"
                        aria-label="First name"
                        required
                      />
                    </div>
                  </div>
                  <div class="row my-3">
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Barcode (EAN/UPC)<span>*</span></label
                      >
                      <input
                        type="text"
                        class="form-control"
                        placeholder="e.g 00123456789"
                        aria-label="First name"
                        required
                      />
                    </div>
                  </div>
                  <div class="row">
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Batch / Lot Number<span>*</span></label
                      >
                      <input
                        type="text"
                        class="form-control"
                        placeholder="e.g LOT-2026-A1"
                        aria-label="First name"
                        required
                      />
                    </div>
                  </div>

                  <!-- Section 3 -->
                  <div class="row my-3">
                    <h3>Stock & Storage</h3>
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Initial Qty<span>*</span>
                      </label>
                      <input
                        type="number"
                        class="form-control"
                        placeholder="0"
                        aria-label="First name"
                        required
                      />
                    </div>
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Reorder Level<span>*</span>
                      </label>
                      <input
                        type="number"
                        class="form-control"
                        placeholder="20"
                        aria-label="First name"
                        required
                      />
                    </div>
                  </div>
                  <div class="row my-3">
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Storage Location<span>*</span>
                      </label>
                      <select
                        name="products"
                        id=""
                        class="form-control"
                        required
                      >
                        <option value="" selected disabled>
                          Select Location
                        </option>
                        <option value="Main">Main Warehouse</option>
                        <option value="Show">Showroom</option>
                        <option value="Elec">Electrical Room</option>
                        <option value="Yard">Yard Storage</option>
                        <option value="T_S">Timber Shed</option>
                        <option value="Chem">Chemical Storage</option>
                      </select>
                    </div>
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Expiry Date (<span>Optional</span>)
                      </label>
                      <input
                        type="date"
                        class="form-control"
                        placeholder="20"
                        aria-label="First name"
                      />
                    </div>
                  </div>

                  <!-- Section 4 -->
                  <div class="row my-3">
                    <h3>Pricing & Notes</h3>
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Unit Cost ($)<span>*</span>
                      </label>
                      <input
                        type="number"
                        class="form-control"
                        placeholder="0.00"
                        aria-label="First name"
                        required
                      />
                    </div>
                  </div>
                  <div class="row my-3">
                    <div class="col">
                      <label for="inputEmail4" class="form-label"
                        >Notes / Description
                      </label>
                      <textarea
                        name=""
                        id=""
                        class="form-control"
                        placeholder="Enter any additional product specifications, notes, or special handling instructions..."
                      ></textarea>
                    </div>
                  </div>
                  <div class="row my-3">
                    <div class="col">
                      <button type="reset" class="btn btn-outline-secondary">
                        Reset Form
                      </button>
                    </div>
                    <div class="col text-end">
                      <button type="submit" class="btn btn-secondary">
                        Submit
                      </button>
                    </div>
                  </div>
                </form>
              </div>
              <!-- <div class="col-2 my-3"> -->
              <!-- Left Portion -->
              <!-- </div> -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
